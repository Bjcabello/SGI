<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">SGI - Sistema de Inventario</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" routerLink="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" routerLink="/products">Productos</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/categories">Categorías</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/suppliers">Proveedores</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">{{ isEditing ? 'Editar' : 'Nuevo' }} Producto</h4>
        </div>
        <div class="card-body">
          <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="onSubmit()" #productForm="ngForm">
            <div class="row">
              <div class="col-md-8 mb-3">
                <label for="name" class="form-label">Nombre del Producto *</label>
                <input 
                  type="text" 
                  class="form-control" 
                  id="name"
                  name="name"
                  [(ngModel)]="product.name"
                  required
                  [disabled]="loading">
              </div>

              <div class="col-md-4 mb-3">
                <label for="sku" class="form-label">SKU *</label>
                <input 
                  type="text" 
                  class="form-control" 
                  id="sku"
                  name="sku"
                  [(ngModel)]="product.sku"
                  required
                  [disabled]="loading">
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Descripción</label>
              <textarea 
                class="form-control" 
                id="description"
                name="description"
                rows="3"
                [(ngModel)]="product.description"
                [disabled]="loading"></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="category" class="form-label">Categoría *</label>
                <select 
                  class="form-select" 
                  id="category"
                  name="category"
                  [(ngModel)]="product.category"
                  required
                  [disabled]="loading">
                  <option [value]="0">Seleccione una categoría</option>
                  <option *ngFor="let category of categories" [value]="category.id">
                    {{ category.name }}
                  </option>
                </select>
                <small class="text-muted" *ngIf="categories.length === 0">
                  <a routerLink="/categories">Crear categorías primero</a>
                </small>
              </div>

              <div class="col-md-6 mb-3">
                <label for="supplier" class="form-label">Proveedor *</label>
                <select 
                  class="form-select" 
                  id="supplier"
                  name="supplier"
                  [(ngModel)]="product.supplier"
                  required
                  [disabled]="loading">
                  <option [value]="0">Seleccione un proveedor</option>
                  <option *ngFor="let supplier of suppliers" [value]="supplier.id">
                    {{ supplier.name }}
                  </option>
                </select>
                <small class="text-muted" *ngIf="suppliers.length === 0">
                  <a routerLink="/suppliers">Crear proveedores primero</a>
                </small>
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="price" class="form-label">Precio *</label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="price"
                  name="price"
                  step="0.01"
                  min="0"
                  [(ngModel)]="product.price"
                  required
                  [disabled]="loading">
              </div>

              <div class="col-md-4 mb-3">
                <label for="quantity" class="form-label">Cantidad Inicial</label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="quantity"
                  name="quantity"
                  min="0"
                  [(ngModel)]="product.quantity"
                  [disabled]="loading">
              </div>

              <div class="col-md-4 mb-3">
                <label for="min_stock" class="form-label">Stock Mínimo</label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="min_stock"
                  name="min_stock"
                  min="1"
                  [(ngModel)]="product.min_stock"
                  [disabled]="loading">
              </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <button 
                type="button" 
                class="btn btn-secondary"
                routerLink="/products"
                [disabled]="loading">
                Cancelar
              </button>
              <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="loading || !productForm.valid || product.category === 0 || product.supplier === 0">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? 'Guardando...' : 'Guardar Producto' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
