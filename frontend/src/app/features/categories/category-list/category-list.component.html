<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">SGI - Sistema de Inventario</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" routerLink="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/products">Productos</a></li>
        <li class="nav-item"><a class="nav-link active" routerLink="/categories">Categorías</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/suppliers">Proveedores</a></li>
      </ul>
      <button class="btn btn-outline-light btn-sm" (click)="logout()">Cerrar Sesión</button>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Categorías</h2>
    <button class="btn btn-success" (click)="newCategory()">+ Nueva Categoría</button>
  </div>

  <div *ngIf="showForm" class="card mb-4">
    <div class="card-header bg-primary text-white">
      {{ isEditing ? 'Editar' : 'Nueva' }} Categoría
    </div>
    <div class="card-body">
      <form (ngSubmit)="saveCategory()" #form="ngForm">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="editingCategory.name" name="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" [(ngModel)]="editingCategory.description" name="description" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary me-2" [disabled]="!form.valid">Guardar</button>
        <button type="button" class="btn btn-secondary" (click)="cancelForm()">Cancelar</button>
      </form>
    </div>
  </div>

  <div *ngIf="loading" class="text-center"><div class="spinner-border"></div></div>

  <div *ngIf="!loading" class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of categories">
          <td>{{ category.id }}</td>
          <td>{{ category.name }}</td>
          <td>{{ category.description }}</td>
          <td>
            <button class="btn btn-sm btn-warning me-1" (click)="editCategory(category)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="deleteCategory(category.id!)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
